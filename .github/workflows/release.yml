name: release

# Triggered by a version tag (e.g. v0.3.0). GoReleaser creates the GitHub
# Release and uploads archives/checksums; the following steps add the Homebrew
# formula, keyless cosign signatures, CycloneDX SBOMs and the GHCR image.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # ADR-005 D1/D4: the Homebrew formula needs the `brews` section, which
      # goreleaser >= v2.16 treats as a hard deprecation (goreleaser check then
      # exits 2). Pin this version together with the release-check job in
      # ci.yml until the migration to homebrew_casks is decided.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.15.4"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Homebrew formula asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          formulas=$(find dist -type f -name "*.rb")
          if [ -z "$formulas" ]; then
            echo "no Homebrew formula generated, nothing to upload"
            exit 0
          fi
          # shellcheck disable=SC2086
          gh release upload "$GITHUB_REF_NAME" $formulas --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        run: |
          cosign sign-blob --yes --output-signature dist/checksums.txt.sig --output-certificate dist/checksums.txt.pem dist/checksums.txt

      - name: Upload signature and certificate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sig dist/checksums.txt.pem --clobber

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p dist/sbom
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "no release archives found" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            name="$(basename "$archive" .tar.gz)"
            syft "$archive" -o "cyclonedx-json=dist/sbom/${name}.cdx.json"
          done

      - name: Upload SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/sbom/*.cdx.json --clobber

      - name: Prepare image metadata
        id: image_meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/paas-ops/kubectl-triage:${{ github.ref_name }}
            ghcr.io/paas-ops/kubectl-triage:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.image_meta.outputs.date }}
          labels: |
            org.opencontainers.image.title=kubectl-triage
            org.opencontainers.image.description=Offline-first Kubernetes incident triage CLI
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Sign container image
        run: cosign sign --yes "ghcr.io/paas-ops/kubectl-triage@${{ steps.image.outputs.digest }}"
