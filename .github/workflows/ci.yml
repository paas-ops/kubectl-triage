name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
        include:
          # ADR-007 D3: the Windows release artifact is committed for amd64 only.
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # ADR-005 D1/D4: goreleaser >= v2.16 makes the `brews` formula section a
      # hard deprecation and `goreleaser check` exits 2. Keep this pin in sync
      # with the release workflow in release.yml.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.15.4"
          args: check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t kubectl-triage:ci .

  windows-test:
    runs-on: windows-latest
    steps:
      # Golden files are compared byte-for-byte, so keep the checkout at LF
      # even if the Windows runner's Git defaults convert line endings.
      - name: Configure Git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # ADR-007 D3: Windows must build and pass the full test suite with zero
      # network and no Unix-only assumptions.
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
