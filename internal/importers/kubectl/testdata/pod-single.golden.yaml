apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: checkout-api-canary
      namespace: checkout
      labels:
        app: checkout-api
        track: canary
    spec:
      nodeName: node-3
      containers:
        - name: checkout-api
          image: registry.example.com/checkout-api:1.5.0-rc1
    status:
      phase: Pending
      containerStatuses:
        - name: checkout-api
          restartCount: 0
          state:
            waiting:
              reason: ContainerCreating
